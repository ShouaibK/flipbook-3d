<style>
:root{
  --stage:#101319; --stage-2:#171b23; --line:#272c37;
  --paper:#fbfaf7; --text:#e9e7e2; --muted:#888d99;
  --brass:#d9a441;
  --bar:56px; --flip-ms:560ms;
  --display:"Newsreader",Georgia,serif;
  --ui:"Inter Tight",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}

.app{display:flex;flex-direction:column;height:100dvh;position:relative}

.bar{height:var(--bar);flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:0 14px;border-bottom:1px solid var(--line);background:var(--stage-2);position:relative;z-index:60}
.bar.foot{border-bottom:0;border-top:1px solid var(--line);gap:14px}
.brand{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(44vw,420px)}
.spacer{flex:1}

.tool{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .16s,color .16s}
.tool:hover{background:#20252f;color:var(--text)}
.tool[aria-pressed="true"]{color:var(--brass);background:#221d12}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:26px 16px;touch-action:pan-y}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 46%,rgba(217,164,65,.07),transparent 70%)}
.deck{position:relative;display:flex;align-items:center;justify-content:center}

/* signature: gilded page-edge stacks that thicken as you read */
.edge{width:var(--w,0px);height:calc(var(--ph) * .985);flex:0 0 auto;
  transition:width var(--flip-ms) cubic-bezier(.3,0,.2,1);opacity:.85;
  background:repeating-linear-gradient(90deg,#efe9dc 0 1px,#cbc3b2 1px 2px,#f6f2e8 2px 3px,#d9a441 3px 4px)}
.edge.l{border-radius:3px 0 0 3px;box-shadow:inset -2px 6px 22px rgba(0,0,0,.5),-6px 10px 26px rgba(0,0,0,.45)}
.edge.r{border-radius:0 3px 3px 0;box-shadow:inset 2px 6px 22px rgba(0,0,0,.5),6px 10px 26px rgba(0,0,0,.45)}

.book{position:relative;width:calc(var(--pw) * 2);height:var(--ph);perspective:2600px;flex:0 0 auto}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;left:4%;right:4%;bottom:-16px;height:26px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.6),transparent 72%);filter:blur(5px)}
.well{position:absolute;inset:0;background:#e6e1d6;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.spine{position:absolute;top:0;bottom:0;left:50%;width:34px;margin-left:-17px;z-index:400;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(20,16,10,.16) 42%,rgba(20,16,10,.26) 50%,rgba(20,16,10,.16) 58%,transparent)}
.book.single .spine{display:none}

.sheet{position:absolute;top:0;left:50%;width:var(--pw);height:var(--ph);
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform var(--flip-ms) cubic-bezier(.42,0,.22,1)}
.book.single .sheet{left:0}
.sheet.flipped{transform:rotateY(-180deg)}

.face{position:absolute;inset:0;overflow:hidden;background:var(--paper);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg)}
.face img{display:block;width:100%;height:100%;object-fit:contain;background:var(--paper)}
.face.blank{background:#efeade}
.face.front::after,.face.back::after{content:"";position:absolute;top:0;bottom:0;width:26px;pointer-events:none}
.face.front::after{left:0;background:linear-gradient(90deg,rgba(60,48,30,.2),transparent)}
.face.back::after{right:0;background:linear-gradient(270deg,rgba(60,48,30,.2),transparent)}
.book.single .face::after{display:none}

.hit{position:absolute;top:0;height:100%;width:50%;z-index:420}
.hit.prev{left:0;cursor:w-resize}
.hit.next{right:0;cursor:e-resize}

.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--muted);transition:border-color .16s,color .16s}
.nav:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.nav:disabled{opacity:.28;cursor:default}
.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.scrub{flex:1;min-width:60px;display:flex;align-items:center}
.scrub input{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--line);outline-offset:6px;cursor:pointer}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--brass);border:2px solid var(--stage-2)}
.scrub input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--brass);border:2px solid var(--stage-2)}
.count{font-family:var(--display);font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{color:var(--text);font-weight:500}

.panel{position:absolute;left:0;right:0;bottom:0;z-index:70;background:#141821;border-top:1px solid var(--line);
  transform:translateY(101%);visibility:hidden;
  transition:transform .28s cubic-bezier(.3,0,.2,1),visibility 0s .28s;
  max-height:min(58vh,430px);display:flex;flex-direction:column}
.panel.open{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.3,0,.2,1),visibility 0s}
.panel[inert]{pointer-events:none}
.panel-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:.02em}
.panel-body{overflow-y:auto;padding:14px;overscroll-behavior:contain}

.thumbs{display:flex;gap:12px;flex-wrap:wrap}
.thumb{width:84px;border-radius:3px;overflow:hidden;border:1px solid transparent;background:#0b0d12;transition:border-color .15s,transform .15s}
.thumb:hover{transform:translateY(-2px)}
.thumb.here{border-color:var(--brass)}
.thumb img,.thumb .ph{display:block;width:100%;aspect-ratio:var(--ar,.72);object-fit:cover;background:#1b2029}
.thumb span{display:block;text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-variant-numeric:tabular-nums}
.thumb.here span{color:var(--brass)}

.toc{list-style:none;display:flex;flex-direction:column;gap:1px}
.toc button{width:100%;text-align:left;display:flex;gap:14px;align-items:baseline;padding:9px 10px;border-radius:6px;font-size:14px}
.toc button:hover{background:#1d222c}
.toc .pg{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.toc .lvl2{padding-left:26px;color:var(--muted);font-size:13px}

.zoom{position:fixed;inset:0;z-index:90;background:rgba(8,10,14,.96);display:none;overflow:auto;padding:20px;overscroll-behavior:contain}
.zoom.open{display:block}
.zoom img{display:block;margin:0 auto;max-width:none;background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.zoom-bar .tool[disabled]{opacity:.3;cursor:default}
.zoom-bar{position:fixed;top:12px;right:14px;z-index:92;display:flex;gap:4px;background:rgba(23,27,35,.9);border-radius:11px;padding:2px}

.intro{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:var(--stage);padding:24px;text-align:center}
.intro.gone{display:none}
.intro-card{max-width:400px;display:flex;flex-direction:column;align-items:center;gap:18px}
.intro h1{font-family:var(--display);font-size:34px;font-weight:400;line-height:1.1}
.intro p{color:var(--muted);font-size:14.5px;line-height:1.6}
.pick{padding:11px 22px;border-radius:999px;background:var(--brass);color:#191307;font-weight:600;font-size:14.5px}
.pick:hover{filter:brightness(1.08)}
.hint{font-size:12.5px;color:#5f646f}
.err{color:#e8836a;font-size:14px;line-height:1.55;max-width:340px}
.drop{position:fixed;inset:12px;border:2px dashed var(--brass);border-radius:14px;display:none;z-index:95;pointer-events:none}
body.dragging .drop{display:block}
.prog{width:190px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--brass);transition:width .2s linear}
.pct{font-size:12.5px;color:#5f646f;font-variant-numeric:tabular-nums}
.spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:760px){
  :root{--bar:52px}
  .stage{padding:14px 10px}
  .brand{font-size:15px;max-width:38vw}
  .bar.foot{gap:10px;padding:0 10px}
  .count{font-size:13px}
  .thumb{width:70px}
}
@media (prefers-reduced-motion:reduce){ .sheet,.edge,.panel,.thumb{transition-duration:1ms} .panel{transition:transform 1ms,visibility 0s 1ms} }
</style>
</head>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);

const THUMB_W   = 170;   // thumbnail render width
const CACHE_MAX = 26;    // full-size renders kept in memory (thumbs are exempt)
const TURN_MS   = 130;   // minimum gap between two page turns

const S = {
  doc:null, n:0, ratio:1.414,
  sheets:[], nSheets:0, s:0, page:1,
  want:1,                       // page the URL hash should keep pointing at
  single: window.innerWidth < 760,
  cache:new Map(), pending:new Map(),
  sound: CONFIG.soundOn, src:null, busy:false, q:0, lastTurn:0,
  zp:1, zscale:1.6
};

const book=$("book"), deck=$("deck"), edgeL=$("edgeL"), edgeR=$("edgeR");

/* ── page-turn sound, generated (no audio file) ─────── */
let actx=null;
function swish(){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const dur=.3, sr=actx.sampleRate, buf=actx.createBuffer(1, Math.floor(sr*dur), sr), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s0=actx.createBufferSource(); s0.buffer=buf;
    const bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.Q=.8;
    bp.frequency.setValueAtTime(1500,actx.currentTime);
    bp.frequency.exponentialRampToValueAtTime(320,actx.currentTime+dur);
    const g=actx.createGain();
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.16,actx.currentTime+.05);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    s0.connect(bp); bp.connect(g); g.connect(actx.destination); s0.start();
  }catch(e){}
}

/* ── rendering + bounded cache ──────────────────────────
   Renders go out as blob URLs, not base64 data URLs: ~30% less
   memory and the browser can free them. Full-size entries are
   evicted LRU-style so resizing the window can't grow forever. */
function inUse(url){
  const imgs=document.images;
  for(let i=0;i<imgs.length;i++) if(imgs[i].src===url) return true;
  return false;
}
function cacheSet(key,url){
  S.cache.set(key,url);
  const big=[]; for(const k of S.cache.keys()) if(!k.endsWith("@"+THUMB_W)) big.push(k);
  while(big.length>CACHE_MAX){
    const k=big.shift(), u=S.cache.get(k);
    S.cache.delete(k);
    if(u && !inUse(u)){ try{ URL.revokeObjectURL(u); }catch(e){} }
  }
}
function renderPage(n, width){
  const key = n+"@"+width;
  if(S.cache.has(key)) return Promise.resolve(S.cache.get(key));
  if(S.pending.has(key)) return S.pending.get(key);
  const job = S.doc.getPage(n).then(p=>{
    const base = p.getViewport({scale:1});
    const vp = p.getViewport({scale: width/base.width});
    const c = document.createElement("canvas");
    c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const ctx=c.getContext("2d",{alpha:false});
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    return p.render({canvasContext:ctx, viewport:vp}).promise.then(()=>
      new Promise((res,rej)=>{
        c.toBlob(b=>{
          if(!b) return rej(new Error("encode failed"));
          const url=URL.createObjectURL(b);
          cacheSet(key,url);
          c.width=c.height=0;          // let the canvas memory go
          res(url);
        },"image/jpeg",.88);
      })
    );
  });
  S.pending.set(key,job);
  job.then(()=>S.pending.delete(key),()=>S.pending.delete(key));
  return job;
}

const DPR = Math.min(window.devicePixelRatio||1, 2);
function mainWidth(){
  const w = book.getBoundingClientRect().width / (S.single?1:2);
  // snapped to 100px steps so a drag-resize can't spawn a new render per pixel
  return Math.min(1700, Math.max(700, Math.round(w*DPR/100)*100));
}

function fill(face, n){
  if(!n || n>S.n){ face.classList.add("blank"); face.innerHTML=""; face.dataset.page=""; return; }
  face.classList.remove("blank");
  if(face.dataset.page == n && face.querySelector("img")) return;
  face.dataset.page = n;
  renderPage(n, mainWidth()).then(url=>{
    if(face.dataset.page != n) return;
    let img=face.querySelector("img");
    if(!img){ img=document.createElement("img"); img.alt="Page "+n; img.decoding="async"; face.appendChild(img); }
    img.src=url;
  }).catch(()=>{});
}

/* ── build sheets ───────────────────────────────────── */
function build(){
  book.querySelectorAll(".sheet").forEach(e=>e.remove());
  S.sheets=[]; S.nSheets=Math.ceil(S.n/2);
  for(let i=0;i<S.nSheets;i++){
    const sh=document.createElement("div");
    sh.className="sheet"; sh.dataset.i=i;
    const f=document.createElement("div"); f.className="face front";
    const b=document.createElement("div"); b.className="face back";
    sh.append(f,b);
    book.appendChild(sh);
    sh.addEventListener("transitionend",e=>{
      if(e.propertyName!=="transform" || e.target!==sh) return;
      S.busy=false; zOrder(); drain();
    });
    S.sheets.push({el:sh, front:f, back:b});
  }
  zOrder();
}
function zOrder(){
  S.sheets.forEach((sh,i)=>{ sh.el.style.zIndex = (i < S.s) ? (i+1) : (S.nSheets - i); });
}

/* ── paint ──────────────────────────────────────────── */
function paint(){
  if(S.single){
    const i=Math.floor((S.page-1)/2), sh=S.sheets[i];
    if(!sh) return;
    const isFront = (S.page % 2 === 1);
    fill(sh.front, i*2+1); fill(sh.back, i*2+2);
    S.sheets.forEach((x,k)=>{
      x.el.style.display = (k===i)?"":"none";
      x.el.classList.toggle("flipped", k===i ? !isFront : false);
    });
    [S.page-1,S.page+1,S.page+2].forEach(p=>{ if(p>0&&p<=S.n) renderPage(p,mainWidth()).catch(()=>{}); });
  } else {
    S.sheets.forEach((sh,i)=>{
      sh.el.style.display="";
      sh.el.classList.toggle("flipped", i < S.s);
    });
    for(let i=Math.max(0,S.s-2); i<=Math.min(S.nSheets-1,S.s+2); i++){
      fill(S.sheets[i].front, i*2+1);
      fill(S.sheets[i].back,  i*2+2);
    }
  }
  zOrder(); chrome();
}

/* ── chrome ─────────────────────────────────────────── */
function first(){ return S.single ? S.page : (S.s===0 ? 1 : S.s*2); }
function chrome(){
  const a=first();
  const b=(!S.single && S.s>0) ? Math.min(a+1,S.n) : a;
  $("count").innerHTML = "<b>"+(a===b? a : a+"–"+b)+"</b> / "+S.n;
  const sc=$("scrub");
  sc.max = S.single ? S.n : S.nSheets;
  sc.value = S.single ? S.page : S.s;
  $("btnPrev").disabled = S.single ? S.page<=1 : S.s<=0;
  $("btnNext").disabled = S.single ? S.page>=S.n : S.s>=S.nSheets;

  const prog = S.single ? (S.page-1)/Math.max(1,S.n-1) : S.s/Math.max(1,S.nSheets);
  const max = S.single ? 0 : Math.min(20, 3 + S.n*0.22);
  edgeL.style.setProperty("--w",(max*prog).toFixed(1)+"px");
  edgeR.style.setProperty("--w",(max*(1-prog)).toFixed(1)+"px");

  document.querySelectorAll(".thumb").forEach(t=>{
    const p=+t.dataset.p; t.classList.toggle("here", p>=a && p<=b);
  });

  // Keep the deep link the user actually opened. #p=7 shows spread 6–7,
  // so don't rewrite it to #p=6 — only move it once page 7 is off screen.
  if(!(S.want>=a && S.want<=b)) S.want=a;
  // Sandboxed / cross-origin iframes (about:srcdoc) block history writes.
  try{ history.replaceState(null,"","#p="+S.want); }catch(e){}
}

/* ── navigation ─────────────────────────────────────── */
function drain(){
  if(!S.q) return;
  const d = S.q>0 ? 1 : -1;
  S.q -= d;
  d>0 ? next() : prev();
}
function cooling(){
  const t=Date.now();
  if(t-S.lastTurn < TURN_MS) return true;
  S.lastTurn=t; return false;
}
function next(){
  if(S.busy){ S.q = Math.max(-3, Math.min(3, S.q+1)); return; }   // queue instead of dropping
  if(S.single){ if(S.page>=S.n) return; if(cooling()) return; S.page++; }
  else { if(S.s>=S.nSheets) return; if(cooling()) return;
         const sh=S.sheets[S.s]; if(sh) sh.el.style.zIndex=999; S.s++; S.busy=true; }
  swish(); paint();
}
function prev(){
  if(S.busy){ S.q = Math.max(-3, Math.min(3, S.q-1)); return; }
  if(S.single){ if(S.page<=1) return; if(cooling()) return; S.page--; }
  else { if(S.s<=0) return; if(cooling()) return;
         const sh=S.sheets[S.s-1]; if(sh) sh.el.style.zIndex=999; S.s--; S.busy=true; }
  swish(); paint();
}
function goPage(p){
  p=Math.max(1,Math.min(S.n,p|0));
  S.want=p;
  if(S.single) S.page=p; else S.s = (p<=1) ? 0 : Math.floor(p/2);
  S.busy=false; S.q=0; paint();
}

/* ── layout ─────────────────────────────────────────── */
function layout(){
  const was=S.single;
  S.single = window.innerWidth < 760;
  if(was!==S.single && S.n){
    if(S.single) S.page=first(); else S.s=(S.page<=1)?0:Math.floor(S.page/2);
  }
  book.classList.toggle("single", S.single);

  const st=$("stage").getBoundingClientRect();
  const availW=st.width-34, availH=st.height-34, cols=S.single?1:2;
  let pw=Math.min(availW/cols, availH/S.ratio), ph=pw*S.ratio;
  if(ph>availH){ ph=availH; pw=ph/S.ratio; }
  [deck,book].forEach(el=>{
    el.style.setProperty("--pw",Math.floor(pw)+"px");
    el.style.setProperty("--ph",Math.floor(ph)+"px");
  });
  if(S.n) paint();
  if(zoomOpen()) zoomFit();
}

/* ── thumbnails (built on first open, not at startup) ── */
let thumbsBuilt=false;
async function thumbs(){
  const wrap=$("thumbs"); wrap.innerHTML="";
  for(let p=1;p<=S.n;p++){
    const b=document.createElement("button");
    b.className="thumb"; b.dataset.p=p;
    b.style.setProperty("--ar",(1/S.ratio).toFixed(3));
    b.innerHTML='<div class="ph"></div><span>'+p+'</span>';
    b.addEventListener("click",()=>{ goPage(p); closePanel("panelThumbs"); });
    wrap.appendChild(b);
  }
  chrome();
  for(let p=1;p<=S.n;p++){
    try{
      const url=await renderPage(p,THUMB_W);
      const b=wrap.querySelector('.thumb[data-p="'+p+'"]');
      if(b && b.firstChild){ const i=new Image(); i.src=url; i.alt="Page "+p; i.decoding="async"; b.replaceChild(i,b.firstChild); }
    }catch(e){}
    await new Promise(r=>setTimeout(r,0));
  }
  chrome();
}
function ensureThumbs(){ if(thumbsBuilt||!S.n) return; thumbsBuilt=true; thumbs(); }

/* ── contents ───────────────────────────────────────── */
async function contents(){
  let out=[]; try{ out=await S.doc.getOutline(); }catch(e){}
  if(!out || !out.length) return;
  const ul=$("toc");
  // sequential — a forEach(async …) here appends nested items out of order
  const add = async (items,lvl)=>{
    for(const it of items){
      const li=document.createElement("li"), btn=document.createElement("button");
      if(lvl>1) btn.className="lvl2";
      const t=document.createElement("span"); t.textContent=it.title||"Untitled";
      btn.appendChild(t); li.appendChild(btn); ul.appendChild(li);
      try{
        const dest = typeof it.dest==="string" ? await S.doc.getDestination(it.dest) : it.dest;
        const pg = (await S.doc.getPageIndex(dest[0])) + 1;
        const s=document.createElement("span"); s.className="pg"; s.textContent=pg;
        btn.appendChild(s);
        btn.addEventListener("click",()=>{ goPage(pg); closePanel("panelToc"); });
      }catch(e){ btn.disabled=true; }
      if(it.items && it.items.length) await add(it.items, lvl+1);
    }
  };
  await add(out,1);
  $("btnToc").hidden=false;
}

/* ── zoom ───────────────────────────────────────────── */
const zoomOpen = () => $("zoom").classList.contains("open");
function zoomFit(){
  const img=$("zoomImg");
  if(!img.getAttribute("src")) return;
  const base=Math.max(280, window.innerWidth-40);
  img.style.width = Math.round(Math.min(3200, base*S.zscale))+"px";
}
function zoomChrome(){
  $("zPrev").disabled = S.zp<=1;
  $("zNext").disabled = S.zp>=S.n;
  $("zOut").disabled  = S.zscale<=0.55;
  $("zIn").disabled   = S.zscale>=3.2;
}
function zoomTo(p){
  if(!S.n) return;
  S.zp = Math.max(1, Math.min(S.n, p));
  const z=$("zoom"), img=$("zoomImg");
  z.classList.add("open"); img.removeAttribute("src"); zoomChrome();
  const w = Math.min(2400, Math.max(1200, Math.round(window.innerWidth*DPR*1.6)));
  renderPage(S.zp, w).then(u=>{
    if(!zoomOpen() ) return;
    img.src=u; img.alt="Page "+S.zp; zoomFit();
  }).catch(()=>{});
}
function zoomClose(){ $("zoom").classList.remove("open"); $("zoomImg").removeAttribute("src"); }
$("btnZoom").addEventListener("click",()=>zoomTo(S.single ? S.page : first()));
$("zPrev").addEventListener("click",()=>zoomTo(S.zp-1));
$("zNext").addEventListener("click",()=>zoomTo(S.zp+1));
$("zIn").addEventListener("click",()=>{ S.zscale=Math.min(3.2,S.zscale*1.3); zoomFit(); zoomChrome(); });
$("zOut").addEventListener("click",()=>{ S.zscale=Math.max(0.55,S.zscale/1.3); zoomFit(); zoomChrome(); });
$("zClose").addEventListener("click",zoomClose);
$("zoom").addEventListener("click",e=>{ if(e.target.id==="zoom") zoomClose(); });

/* ── panels ─────────────────────────────────────────── */
const anyPanelOpen = () => !!document.querySelector(".panel.open");
let panelOpener=null;
function openPanel(id){
  panelOpener = document.activeElement;
  document.querySelectorAll(".panel").forEach(p=>{
    const on = p.id===id;
    p.classList.toggle("open",on);
    p.setAttribute("aria-hidden", String(!on));
    p.inert = !on;                       // keeps closed panels out of the tab order
  });
  if(id==="panelThumbs") ensureThumbs();
  const f=$(id).querySelector("button");  // move focus into the panel, not past it
  if(f) f.focus();
}
function closePanel(id){
  const p=$(id);
  if(!p.classList.contains("open")) return;
  p.classList.remove("open"); p.setAttribute("aria-hidden","true"); p.inert=true;
  if(panelOpener && document.contains(panelOpener)) panelOpener.focus();
  panelOpener=null;
}
document.querySelectorAll(".panel").forEach(p=>{ p.inert=true; });
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closePanel(b.dataset.close)));
const toggle = id => $(id).classList.contains("open") ? closePanel(id) : openPanel(id);
$("btnThumbs").addEventListener("click",()=>toggle("panelThumbs"));
$("btnToc").addEventListener("click",()=>toggle("panelToc"));

/* ── controls ───────────────────────────────────────── */
$("btnPrev").addEventListener("click",prev);
$("btnNext").addEventListener("click",next);
// a swipe already turned the page — don't let the click that follows turn it again
let swipedAt=0;
const fromSwipe = () => Date.now()-swipedAt < 400;
$("hitPrev").addEventListener("click",()=>{ if(!fromSwipe()) prev(); });
$("hitNext").addEventListener("click",()=>{ if(!fromSwipe()) next(); });
$("scrub").addEventListener("input",e=>{
  const v=+e.target.value;
  if(S.single) S.page=Math.max(1,v); else S.s=v;
  S.busy=false; S.q=0; S.want=first(); paint();
});
$("btnSound").addEventListener("click",e=>{
  S.sound=!S.sound;
  e.currentTarget.setAttribute("aria-pressed",String(S.sound));
  if(S.sound) swish();
});
$("btnSound").setAttribute("aria-pressed",String(S.sound));
$("btnFull").addEventListener("click",()=>{
  document.fullscreenElement ? document.exitFullscreen()
    : document.documentElement.requestFullscreen().catch(()=>{});
});
$("btnDownload").addEventListener("click",()=>{
  if(!S.src) return;
  const a=document.createElement("a");
  a.href=S.src; a.download=(CONFIG.pdf||"document.pdf").split("/").pop();
  document.body.appendChild(a); a.click(); a.remove();
});

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(zoomOpen()){
    if(e.key==="ArrowRight"){ e.preventDefault(); zoomTo(S.zp+1); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); zoomTo(S.zp-1); }
    else if(e.key==="+"||e.key==="="){ e.preventDefault(); $("zIn").click(); }
    else if(e.key==="-"){ e.preventDefault(); $("zOut").click(); }
    else if(e.key==="Escape"){ zoomClose(); }
    return;
  }
  if(anyPanelOpen()){                       // don't flip pages behind an open panel
    if(e.key==="Escape"){ closePanel("panelThumbs"); closePanel("panelToc"); }
    return;
  }
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Home"){ e.preventDefault(); goPage(1); }
  else if(e.key==="End"){ e.preventDefault(); goPage(S.n); }
});

let sx=0, sy=0, tracking=false;
$("stage").addEventListener("pointerdown",e=>{ sx=e.clientX; sy=e.clientY; tracking=true; });
$("stage").addEventListener("pointercancel",()=>{ tracking=false; });
$("stage").addEventListener("pointerup",e=>{
  if(!tracking) return; tracking=false;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)*1.6){
    swipedAt=Date.now();                    // suppress the click this gesture will fire
    dx<0 ? next() : prev();
  }
});

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(layout,140); });
window.addEventListener("hashchange",()=>{
  const p=parseInt((location.hash.match(/p=(\d+)/)||[])[1]||"",10);
  if(p && p!==S.want) goPage(p);
});

/* ── loading ────────────────────────────────────────── */
function intro(html){ $("introCard").innerHTML=html; $("intro").classList.remove("gone"); }
function progress(frac){
  const bar=$("progBar"), pct=$("progPct");
  if(!bar||!pct) return;
  if(frac==null){ pct.textContent="Loading…"; return; }
  const v=Math.max(0,Math.min(1,frac));
  bar.style.width=(v*100).toFixed(0)+"%";
  pct.textContent=(v*100).toFixed(0)+"%";
}

function readFile(f){
  intro('<div class="spin"></div><p>Opening '+f.name.replace(/[<>&]/g,"")+'…</p>');
  const r=new FileReader();
  r.onerror=()=>chooser("Couldn’t read that file.");
  r.onload=()=>load({data:new Uint8Array(r.result)}, f.name);
  r.readAsArrayBuffer(f);
}

function chooser(msg){
  intro(
    '<h1>Open your flipbook</h1>'+
    (msg ? '<p class="err"></p>'
         : '<p>Pick a PDF from this device, or drag one onto the window. Nothing is uploaded — it stays in your browser.</p>')+
    '<button class="pick" id="pickBtn">Choose a PDF</button>'+
    '<input type="file" id="pickInput" accept="application/pdf" hidden>'+
    '<p class="hint">← → to turn · click the page edges · pinch or zoom for detail</p>'
  );
  if(msg) $("introCard").querySelector(".err").textContent=msg;
  $("pickBtn").addEventListener("click",()=>$("pickInput").click());
  $("pickInput").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) readFile(f); });
}

let LIB=null;

async function load(src, name){
  try{
    const opts = (typeof src === "string") ? {url:src} : Object.assign({},src);
    opts.isEvalSupported = false;          // hardening: no eval path for untrusted PDFs
    const task = LIB.getDocument(opts);
    task.onProgress = p => progress(p && p.total ? p.loaded/p.total : null);
    S.doc = await task.promise;
    S.n = S.doc.numPages;
    const p1 = await S.doc.getPage(1);
    const v = p1.getViewport({scale:1});
    S.ratio = v.height / v.width;

    let title = CONFIG.title;
    if(!title){ try{ const m=await S.doc.getMetadata(); title=(m.info&&m.info.Title)||""; }catch(e){} }
    $("brand").textContent = title || name || "Flipbook";
    document.title = title || name || "Flipbook";

    if(CONFIG.showDownload && typeof src === "string"){ S.src=src; $("btnDownload").hidden=false; }

    build();
    const hash = parseInt((location.hash.match(/p=(\d+)/)||[])[1] || CONFIG.startPage, 10) || 1;
    S.page = Math.min(Math.max(1,hash), S.n);
    S.want = S.page;
    S.s = (S.page<=1) ? 0 : Math.floor(S.page/2);
    layout();
    $("intro").classList.add("gone");
    contents();
  }catch(err){
    console.error(err);
    chooser(location.protocol === "file:"
      ? "Browsers block file loading over file:// — run a local server (python3 -m http.server) or choose the PDF below."
      : "Couldn’t open that PDF. Check the path in CONFIG, or pick a file below.");
  }
}

["dragenter","dragover"].forEach(t=>window.addEventListener(t,e=>{ e.preventDefault(); document.body.classList.add("dragging"); }));
window.addEventListener("dragleave",e=>{ if(e.clientX<=0||e.clientY<=0) document.body.classList.remove("dragging"); });
window.addEventListener("drop",e=>{
  e.preventDefault(); document.body.classList.remove("dragging");
  const f=e.dataTransfer && e.dataTransfer.files[0];
  if(f && /pdf/i.test(f.type||f.name)) readFile(f);
});

// A relative path can't be resolved inside about:srcdoc, so check before loading.
function resolvePdf(t){
  if(!t) return null;
  try{
    const u = new URL(t, document.baseURI);
    return /^(https?|file|blob|data):$/.test(u.protocol) ? u.href : null;
  }catch(e){ return null; }
}
// ?pdf= is limited to this site: otherwise any link could render a stranger's
// PDF under this domain and this company's name.
function sameOrigin(t){
  try{ return new URL(t, document.baseURI).origin === location.origin; }catch(e){ return false; }
}

let booted=false;
window.__flipbook = function(lib){
  if(booted) return;                       // module + nomodule can never both win
  booted=true; clearTimeout(watchdog);
  LIB = lib;
  if(!LIB){ layout(); chooser("PDF engine didn’t load. Check your connection and reload."); return; }
  let q=null; try{ q = new URLSearchParams(location.search).get("pdf"); }catch(e){}
  if(q && !sameOrigin(q)) q=null;
  const target = resolvePdf(q || CONFIG.pdf);
  layout();
  target ? load(target) : chooser();
};
// if no loader ever fires (very old browser, blocked CDN), don't spin forever
const watchdog = setTimeout(()=>{ if(!booted) window.__flipbook(null); }, 20000);
})();
</script>

<!-- PDF engine. pdf.js 4.x (ESM) first — 3.x predates the fix for the
     malicious-font RCE, and this page can open PDFs a visitor supplies.
     Falls back to the old build, then to the file picker, if a CDN is blocked. -->
<script type="module">
const V4="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/";
const V3="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadUmd(){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=V3+"pdf.min.js";
    s.onload=()=>{ const l=window.pdfjsLib;
      if(!l) return rej(new Error("pdfjsLib missing"));
      l.GlobalWorkerOptions.workerSrc=V3+"pdf.worker.min.js"; res(l); };
    s.onerror=()=>rej(new Error("cdn unreachable"));
    document.head.appendChild(s);
  });
}
// no top-level await here: Safari 14 parses modules but not TLA,
// and a parse error would leave the page stuck on the spinner.
(async function(){
  let lib=null;
  try{
    lib = await import(V4+"pdf.min.mjs");
    lib.GlobalWorkerOptions.workerSrc = V4+"pdf.worker.min.mjs";
  }catch(e){
    console.warn("pdf.js 4 unavailable, falling back:",e);
    try{ lib = await loadUmd(); }catch(e2){ console.error(e2); lib=null; }
  }
  window.pdfjsLib = lib;
  window.__flipbook(lib);
})();
</script>

<!-- Browsers with no ES-module support -->
<script nomodule src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script nomodule>
if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
window.__flipbook(window.pdfjsLib || null);
</script>
</body>
