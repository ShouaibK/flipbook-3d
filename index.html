<script>
const CONFIG = {
  pdf: "AK-Trading-House-profile.pdf",
  title: "AK Trading House — Company Profile",
  soundOn: true,
  showDownload: true,
  startPage: 1,
  flipMs: 620,          // ek page turn ka time (chhota = tez)
  flexibility: 0.9,     // page kitna mudta hai (0 = flat board, 1.2 = bohot)
  peel: 1.0,            // hover par kona kitna uthe (0 = band, 1.6 = zyada)
  peelSpan: 0.45,       // page ka kitna hissa peel me shaamil ho (0.3 = sirf kona)
  peelCurl: 2.6,        // kona kitna tight roll kare
  shadows: true,        // turning page ka shadow neeche wale pages par
  thickness: true,      // book ki motai (page stack)
  portraitRotate: 1     // phone portrait me book 90° ghumao: 1, doosri taraf: -1, band: 0
};

<style>
:root{
  --page:#faf6f2; --ink:#3a3330; --muted:#8b8179; --line:#e6ddd5;
  --accent:#c0451f;
  --chrome:#ffffff;
  --ui:"Inter Tight",system-ui,-apple-system,sans-serif;
  --display:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.app{display:flex;flex-direction:column;height:100dvh;position:relative}

.head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:16px 22px 4px}
.brand{font-family:var(--display);font-size:19px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}

/* ── stage ─────────────────────────────────────────── */
.stage{flex:1;min-height:0;position:relative;touch-action:pan-y;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#cv.grab{cursor:grab} #cv.grabbing{cursor:grabbing}
.flat{position:absolute;inset:0;display:none;place-items:center;gap:0}
.flat.on{display:grid}
.flat .pg{display:flex;box-shadow:0 10px 34px rgba(70,50,34,.26)}
.flat img{display:block;height:auto;background:#fff}

.chev{position:absolute;top:50%;transform:translateY(-50%);z-index:20;
  width:52px;height:52px;display:grid;place-items:center;color:#b9aca2;
  transition:color .18s,transform .18s,opacity .18s}
.chev.l{left:6px} .chev.r{right:6px}
.stage.rolled .chev{top:auto;bottom:auto;left:50%;right:auto}
.stage.rolled .chev.l{top:6px;transform:translateX(-50%) rotate(90deg)}
.stage.rolled .chev.r{bottom:6px;transform:translateX(-50%) rotate(90deg)}
.stage.rolled .chev.l:hover:not(:disabled){transform:translateX(-50%) rotate(90deg) translateX(-3px)}
.stage.rolled .chev.r:hover:not(:disabled){transform:translateX(-50%) rotate(90deg) translateX(3px)}
.chev svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.chev:hover:not(:disabled){color:var(--accent)}
.chev.l:hover:not(:disabled){transform:translateY(-50%) translateX(-3px)}
.chev.r:hover:not(:disabled){transform:translateY(-50%) translateX(3px)}
.chev:disabled{opacity:.22;cursor:default}

/* ── toolbar pill ──────────────────────────────────── */
.pill{flex:0 0 auto;margin:0 auto 20px;display:flex;align-items:center;
  background:var(--chrome);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 2px 14px rgba(60,40,25,.10);overflow:visible;position:relative;z-index:30}
.pill .pg{padding:0 15px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
  border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.tool{width:44px;height:44px;display:grid;place-items:center;color:#6f6862;border-radius:9px;
  transition:background .15s,color .15s}
.tool:hover:not(:disabled){background:#f3ece6;color:var(--ink)}
.tool[aria-pressed="true"]{color:var(--accent)}
.tool:disabled{opacity:.3;cursor:default}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.more-wrap{position:relative}
.menu{position:absolute;bottom:calc(100% + 10px);right:0;min-width:184px;
  background:var(--chrome);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 10px 30px rgba(60,40,25,.16);padding:5px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;
  border-radius:7px;font-size:13.5px;color:var(--ink);text-align:left}
.menu button:hover{background:#f3ece6}
.menu svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ── panels ────────────────────────────────────────── */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:70;background:var(--chrome);
  border-top:1px solid var(--line);transform:translateY(101%);visibility:hidden;
  transition:transform .28s cubic-bezier(.3,0,.2,1),visibility 0s .28s;
  max-height:min(58vh,430px);display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(60,40,25,.10)}
.panel.open{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.3,0,.2,1),visibility 0s}
.panel[inert]{pointer-events:none}
.panel-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--display);font-size:16px;font-weight:500}
.panel-body{overflow-y:auto;padding:16px;overscroll-behavior:contain}

.thumbs{display:flex;gap:13px;flex-wrap:wrap}
.thumb{width:86px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:#fff;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.thumb:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(60,40,25,.12)}
.thumb.here{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb img,.thumb .ph{display:block;width:100%;aspect-ratio:var(--ar,.72);object-fit:cover;background:#f1eae3}
.thumb span{display:block;text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-variant-numeric:tabular-nums}
.thumb.here span{color:var(--accent)}

.toc{list-style:none;display:flex;flex-direction:column;gap:1px}
.toc button{width:100%;text-align:left;display:flex;gap:14px;align-items:baseline;padding:9px 11px;border-radius:7px;font-size:14px}
.toc button:hover{background:#f3ece6}
.toc .pg{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.toc .lvl2{padding-left:26px;color:var(--muted);font-size:13px}

/* ── zoom ──────────────────────────────────────────── */
.zoom{position:fixed;inset:0;z-index:90;background:rgba(28,22,18,.94);display:none;overflow:auto;padding:20px;overscroll-behavior:contain}
.zoom.open{display:block}
.zoom img{display:block;margin:0 auto;max-width:none;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.zoom-bar{position:fixed;top:12px;right:14px;z-index:92;display:flex;gap:2px;
  background:var(--chrome);border:1px solid var(--line);border-radius:11px;padding:3px}

/* ── intro / share ─────────────────────────────────── */
.intro{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:var(--page);padding:24px;text-align:center}
.intro.gone{display:none}
.intro-card{max-width:400px;display:flex;flex-direction:column;align-items:center;gap:16px}
.intro h1{font-family:var(--display);font-size:32px;font-weight:400;line-height:1.15}
.intro p{color:var(--muted);font-size:14.5px;line-height:1.6}
.pick{padding:11px 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:14.5px;text-decoration:none}
.pick:hover{filter:brightness(1.08)}
.hint{font-size:12.5px;color:#a89c93}
.err{color:#b23b17;font-size:14px;line-height:1.55;max-width:340px}
.prog{width:190px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.pct{font-size:12.5px;color:#a89c93;font-variant-numeric:tabular-nums}
.spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;display:none;z-index:95;pointer-events:none}
body.dragging .drop{display:block}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .head{padding:12px 16px 2px}
  .brand{font-size:16px}
  .chev{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.82);
    box-shadow:0 1px 6px rgba(60,40,25,.14);color:#7d736b}
  .chev svg{width:22px;height:22px}
  .chev.l{left:4px} .chev.r{right:4px}
  .chev:disabled{opacity:0}
  .pill{margin-bottom:14px}
  .tool{width:40px;height:40px}
  .thumb{width:72px}
}
/* phone on its side: every pixel of height belongs to the book */
@media (max-height:540px) and (orientation:landscape){
  .head{display:none}
  .pill{margin-bottom:7px}
  .pill .pg{padding:0 11px;font-size:12px}
  .tool{width:36px;height:36px}
  .tool svg{width:18px;height:18px}
  .chev{width:40px;height:40px}
  .chev svg{width:26px;height:26px}
  .panel{max-height:min(74vh,300px)}
}
@media (prefers-reduced-motion:reduce){ .panel,.thumb{transition-duration:1ms} }
</style>
</head>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const CVS=$("cv");

const THUMB_W=170, CACHE_MAX=22;
const DUR=CONFIG.flipMs||900;
const FLEX=CONFIG.flexibility!=null?CONFIG.flexibility:0.9;
const PEELMAX=CONFIG.peel!=null?CONFIG.peel:1.0;
const PEELPHI=0.34;   // radians the grabbed corner lifts on hover
const PEELCURL=CONFIG.peelCurl!=null?CONFIG.peelCurl:2.6;
const PEELSPAN=CONFIG.peelSpan!=null?CONFIG.peelSpan:0.45;

const S={
  doc:null,n:0,ratio:1.414,nSheets:0,
  s:0,page:1,want:1,
  single:false,forceSingle:false,
  cache:new Map(),pending:new Map(),
  sound:CONFIG.soundOn,src:null,zp:1,zscale:1.6,
  MW:900,DPR:1,
  anim:null,q:0,peel:null,drag:null,roll:0,
  gl:null,flat:false
};

/* ══ sound ══ */
let actx=null;
function swish(){
  if(!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const dur=.36,sr=actx.sampleRate,buf=actx.createBuffer(1,Math.floor(sr*dur),sr),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s0=actx.createBufferSource(); s0.buffer=buf;
    const bp=actx.createBiquadFilter(); bp.type="bandpass"; bp.Q=.75;
    bp.frequency.setValueAtTime(1700,actx.currentTime);
    bp.frequency.exponentialRampToValueAtTime(330,actx.currentTime+dur);
    const g=actx.createGain();
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.13,actx.currentTime+.07);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    s0.connect(bp); bp.connect(g); g.connect(actx.destination); s0.start();
  }catch(e){}
}

/* ══ render cache ══ */
function inUse(url){
  const im=document.images;
  for(let i=0;i<im.length;i++) if(im[i].src===url) return true;
  return false;
}
function cacheSet(key,e){
  S.cache.set(key,e);
  const big=[]; for(const k of S.cache.keys()) if(!k.endsWith("@"+THUMB_W)) big.push(k);
  while(big.length>CACHE_MAX){
    const k=big.shift(), x=S.cache.get(k);
    S.cache.delete(k);
    if(x){ if(x.tex) x.tex.dispose(); if(!inUse(x.url)){ try{ URL.revokeObjectURL(x.url); }catch(q){} } }
  }
}
function renderPage(n,width){
  const key=n+"@"+width;
  if(S.cache.has(key)) return Promise.resolve(S.cache.get(key));
  if(S.pending.has(key)) return S.pending.get(key);
  const job=S.doc.getPage(n).then(p=>{
    const base=p.getViewport({scale:1});
    const vp=p.getViewport({scale:width/base.width});
    const c=document.createElement("canvas");
    c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const cx=c.getContext("2d",{alpha:false});
    cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height);
    return p.render({canvasContext:cx,viewport:vp}).promise.then(()=>new Promise((res,rej)=>{
      c.toBlob(b=>{
        if(!b) return rej(new Error("encode failed"));
        const url=URL.createObjectURL(b), img=new Image();
        img.onload=()=>{ const e={url,img,tex:null}; cacheSet(key,e); c.width=c.height=0; res(e); };
        img.onerror=()=>rej(new Error("decode failed"));
        img.src=url;
      },"image/jpeg",.92);
    }));
  });
  S.pending.set(key,job);
  job.then(()=>S.pending.delete(key),()=>S.pending.delete(key));
  return job;
}
function entry(p){
  if(!p||p<1||p>S.n) return null;
  return S.cache.get(p+"@"+S.MW)||null;
}
function want(p){
  if(!p||p<1||p>S.n) return null;
  const e=entry(p);
  if(e) return e;
  renderPage(p,S.MW).then(()=>{ mark(); }).catch(()=>{});
  return null;
}
function prefetch(){
  const c=S.single?S.page:S.s*2;
  for(let p=c-2;p<=c+5;p++) if(p>0&&p<=S.n) want(p);
}

/* ══════════════════════════════════════════════════════
   WebGL book
   ══════════════════════════════════════════════════════ */
let T3=null;                     // three.js namespace
const G={};                      // gl objects
const NX=44, NY=30;              // flap mesh resolution

function texOf(p){
  const e=want(p); if(!e) return null;
  if(!e.tex){
    const t=new T3.Texture(e.img);
    if(T3.SRGBColorSpace) t.colorSpace=T3.SRGBColorSpace; else t.encoding=3001;
    t.anisotropy=G.maxAniso; t.generateMipmaps=true;
    t.minFilter=T3.LinearMipmapLinearFilter; t.magFilter=T3.LinearFilter;
    t.needsUpdate=true; e.tex=t;
  }
  return e.tex;
}
function paperMat(){
  return new T3.MeshLambertMaterial({color:0xffffff,side:T3.FrontSide});
}
function grid(nx,ny){
  const g=new T3.BufferGeometry();
  const np=(nx+1)*(ny+1);
  const pos=new Float32Array(np*3), uv=new Float32Array(np*2);
  const iA=[],iB=[];
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const a=j*(nx+1)+i,b=a+1,c=a+nx+1,d=c+1;
    iA.push(a,b,c, b,d,c);   // CCW: front face toward the camera
    iB.push(a,c,b, b,c,d);   // mirrored page: winding flips back
  }
  g.setAttribute("position",new T3.BufferAttribute(pos,3));
  g.setAttribute("normal",new T3.BufferAttribute(new Float32Array(np*3),3));
  g.setAttribute("uv",new T3.BufferAttribute(uv,2));
  g.setIndex(iA);
  g.userData={iA,iB};
  return g;
}
function setUV(g,mirror){
  const uv=g.attributes.uv.array;
  let k=0;
  for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){
    const u=i/NX;
    uv[k++]=mirror?1-u:u; uv[k++]=j/NY;
  }
  g.attributes.uv.needsUpdate=true;
}

function initGL(){
  try{
    const r=new T3.WebGLRenderer({canvas:CVS,antialias:true,alpha:true,powerPreference:"high-performance"});
    r.setClearColor(0x000000,0);
    if(CONFIG.shadows){ r.shadowMap.enabled=true; r.shadowMap.type=T3.PCFSoftShadowMap; }
    if(T3.SRGBColorSpace) r.outputColorSpace=T3.SRGBColorSpace;
    G.r=r; G.maxAniso=r.capabilities.getMaxAnisotropy();
  }catch(e){ return false; }

  G.scene=new T3.Scene();
  G.cam=new T3.PerspectiveCamera(26,1,.05,60);
  G.cam.position.set(0,0,6);

  // three.js divides ambient/directional irradiance by PI, so these look large:
  // measured, they put a flat page at exactly its texture colour (192,68,30 vs 192,69,31).
  G.scene.add(new T3.AmbientLight(0xffffff,2.36));
  const dir=new T3.DirectionalLight(0xfff6ec,0.98);
  dir.position.set(-0.85,1.5,2.9);
  if(CONFIG.shadows){
    dir.castShadow=true;
    dir.shadow.mapSize.set(1024,1024);
    dir.shadow.camera.near=1.4; dir.shadow.camera.far=6.5;
    // fitted to the book, not a huge square: 4x the texel density of before
    dir.shadow.camera.left=-1.35; dir.shadow.camera.right=1.35;
    dir.shadow.camera.top=1.0; dir.shadow.camera.bottom=-1.0;
    dir.shadow.bias=-0.0004; dir.shadow.normalBias=0.004; dir.shadow.radius=5;
  }
  G.scene.add(dir); G.dir=dir;

  G.book=new T3.Group(); G.scene.add(G.book);

  const pg=new T3.PlaneGeometry(1,1,1,1);
  G.pageL=new T3.Mesh(pg,paperMat()); G.pageR=new T3.Mesh(pg,paperMat());
  [G.pageL,G.pageR].forEach(m=>{ m.receiveShadow=!!CONFIG.shadows; G.book.add(m); });

  G.gF=grid(NX,NY); G.gB=grid(NX,NY);
  // front and back are the same surface: share the heavy attributes, only UVs differ
  G.gB.setAttribute("position",G.gF.attributes.position);
  G.gB.setAttribute("normal",G.gF.attributes.normal);
  G.flapF=new T3.Mesh(G.gF,paperMat());
  G.flapZ=0.0016;
  G.flapB=new T3.Mesh(G.gB,new T3.MeshLambertMaterial({color:0xffffff,side:T3.BackSide}));
  [G.flapF,G.flapB].forEach(m=>{ m.castShadow=!!CONFIG.shadows; m.receiveShadow=false; m.visible=false; G.book.add(m); });

  if(CONFIG.thickness){
    const sm=new T3.MeshLambertMaterial({color:0xece5da});
    G.slabL=new T3.Mesh(new T3.BoxGeometry(1,1,1),sm);
    G.slabR=new T3.Mesh(new T3.BoxGeometry(1,1,1),sm);
    [G.slabL,G.slabR].forEach(m=>{ m.receiveShadow=!!CONFIG.shadows; G.book.add(m); });
  }
  // soft darkening in the gutter
  const cc=document.createElement("canvas"); cc.width=64; cc.height=4;
  const cg=cc.getContext("2d");
  const lg=cg.createLinearGradient(0,0,64,0);
  lg.addColorStop(0,"rgba(60,44,30,0)"); lg.addColorStop(.5,"rgba(60,44,30,.42)"); lg.addColorStop(1,"rgba(60,44,30,0)");
  cg.fillStyle=lg; cg.fillRect(0,0,64,4);
  const gt=new T3.CanvasTexture(cc);
  G.gutter=new T3.Mesh(new T3.PlaneGeometry(1,1),
    new T3.MeshBasicMaterial({map:gt,transparent:true,depthWrite:false}));
  G.book.add(G.gutter);
  return true;
}

/* ══ geometry of the book in world units ══ */
function dims(){
  const H=1, W=1/S.ratio;
  return {W,H};
}
function fitCamera(){
  const st=$("stage").getBoundingClientRect();
  const w=Math.max(1,Math.round(st.width)), h=Math.max(1,Math.round(st.height));
  S.DPR=Math.min(window.devicePixelRatio||1,2);
  G.r.setPixelRatio(S.DPR); G.r.setSize(w,h,false);
  G.cam.aspect=w/h;
  const {W,H}=dims();
  const halfW=(S.single?W/2:W)*1.10, halfH=H/2*1.14;
  const t=Math.tan(G.cam.fov*Math.PI/360);
  // Rolling the camera 90° swaps which screen axis each world axis lands on,
  // so the two fit limits swap with it.
  G.cam.rotation.z=S.roll*Math.PI/2;
  G.cam.position.z = S.roll
    ? Math.max(halfW/t, halfH/(t*G.cam.aspect))
    : Math.max(halfH/t, halfW/(t*G.cam.aspect));
  G.cam.updateProjectionMatrix();
  S.MW=Math.min(1700,Math.max(700,Math.round(w*S.DPR/(S.single?1:2)/100)*100));
}

/* ══ the bend ══
   Every row of the page rotates about the spine, but rows far from the corner
   you grabbed lag behind — that lag is what makes the crease run diagonally and
   the corner lead. Within a row the page also curls (phi grows toward the free
   edge), so it bows like paper instead of pivoting like a board. The lag is
   scaled by sin(PHI) so all rows agree again when the page is flat, open or shut. */
const LAG=1.0;   // >1 would push far rows to a negative angle near PHI=0
function deform(sgn,PHI,st){
  const {W,H}=dims();
  const P=G.gF.attributes.position.array, N=G.gF.attributes.normal.array;
  const du=1/NX;
  const cyGrab=st.cy, boost=st.boost||1, span=st.span||1;
  let k=0;
  // Lag is strongest early (corner leads, page peels) and fades as the page
  // comes round, so it never shears into a wedge at large angles.
  const base=LAG*Math.sin(PHI)*Math.pow(Math.max(0,1-PHI/Math.PI),1.5);
  // A peel must leave the anchored side perfectly flat (lag == PHI), a full turn
  // must not. Blend between the two so a drag crosses over without a jump.
  const w=Math.min(1,Math.max(0,(PHI-0.45)/0.75));
  const lag=st.flatFar ? PHI*(1-w)+base*w : base;
  for(let j=0;j<=NY;j++){
    const y=(j/NY-.5)*H;
    const q=Math.min(1,Math.abs(y-cyGrab)/(H*span));
    const th=Math.max(0,PHI-lag*Math.pow(q,.9));
    // the grabbed corner also bows more than the anchored side
    const K=FLEX*boost*Math.sin(th)*(0.5+0.5*(1-q));
    let x=0,z=0;
    P[k]=0; P[k+1]=y; P[k+2]=0;
    N[k]=-sgn*Math.sin(th); N[k+1]=0; N[k+2]=Math.cos(th);
    k+=3;
    for(let i=1;i<=NX;i++,k+=3){
      const u=(i-.5)*du, phi=th+K*u*u;
      const cp=Math.cos(phi), sp=Math.sin(phi);
      x+=W*du*cp; z+=W*du*sp;
      P[k]=sgn*x; P[k+1]=y; P[k+2]=z;
      // analytic normal — much cheaper than computeVertexNormals every frame
      N[k]=-sgn*sp; N[k+1]=0; N[k+2]=cp;
    }
  }
  G.gF.attributes.position.needsUpdate=true;
  G.gF.attributes.normal.needsUpdate=true;
}
/* how far round the page is, from a dragged corner position */
function phiFromX(tx){
  const {W}=dims();
  return Math.PI*Math.max(0,Math.min(1,(W-tx)/(2*W)));
}

/* ══ scene state ══ */
function shiftX(s){
  const {W}=dims();
  if(S.single) return 0;
  return s===0 ? -W/2 : (s>=S.nSheets ? W/2 : 0);
}
function place(){
  const {W,H}=dims();
  G.pageL.scale.set(W,H,1); G.pageR.scale.set(W,H,1);
  G.pageL.position.set(-W/2,0,0); G.pageR.position.set(W/2,0,0);
  G.gutter.scale.set(W*0.30,H,1); G.gutter.position.set(0,0,0.0024);
  if(G.slabL){
    const th=0.012;
    const a=Math.max(1,S.s), b=Math.max(1,S.nSheets-S.s);
    const dl=th*Math.min(1,a/Math.max(1,S.nSheets))*2+0.004;
    const dr=th*Math.min(1,b/Math.max(1,S.nSheets))*2+0.004;
    G.slabL.scale.set(W,H,dl); G.slabL.position.set(-W/2,0,-dl/2-0.001);
    G.slabR.scale.set(W,H,dr); G.slabR.position.set(W/2,0,-dr/2-0.001);
  }
}
/* blank=true keeps a plain paper quad where a page does not exist — the inside
   of a cover. Without it the mesh switches off and you see straight through the
   book, which is what a peel at the first or last spread used to do. */
function setPage(mesh,p,blank){
  const ok=!!p&&p>=1&&p<=S.n;
  const t=ok?texOf(p):null;
  mesh.material.map=t||null;
  mesh.material.color.setHex(t?0xffffff:0xfbf8f4);
  mesh.material.needsUpdate=true;
  mesh.visible=ok||!!blank;
}
function scene(){
  if(S.flat) return flatDraw();
  const {W,H}=dims();
  const a=S.anim, dr=S.drag, pl=S.peel;
  place();

  let PHI=-1,sgn=1,front=0,back=0,shift;
  if(a){
    shift=shiftX(a.s0)+(shiftX(a.s1)-shiftX(a.s0))*a.pe;
    setPage(G.pageL,a.underL,true); setPage(G.pageR,a.underR,true);
    sgn=a.sgn; front=a.front; back=a.back; PHI=a.phi;
  }else if(dr){
    shift=shiftX(dr.s0)+(shiftX(dr.s1)-shiftX(dr.s0))*Math.min(1,dr.t*1.9);
    setPage(G.pageL,dr.underL,true); setPage(G.pageR,dr.underR,true);
    sgn=dr.sgn; front=dr.front; back=dr.back; PHI=dr.phi;
  }else{
    shift=shiftX(S.s);
    if(S.single){ setPage(G.pageL,null); setPage(G.pageR,S.page); G.pageR.position.set(0,0,0); }
    else{
      G.pageR.position.set(W/2,0,0);
      setPage(G.pageL,S.s===0?null:2*S.s);
      setPage(G.pageR,S.s>=S.nSheets?null:2*S.s+1);
    }
    if(pl){
      sgn=pl.sgn; front=pl.front; back=pl.back;
      if(sgn>0) setPage(G.pageR,pl.under,true); else setPage(G.pageL,pl.under,true);
      PHI=pl.phi;
    }
  }
  G.book.position.x=shift;
  // The gutter sits just above the flat page but far below a lifted one, so the
  // depth test alone hides it exactly where the turning page covers it. No fade,
  // no opacity animation — nothing to pop at the end of a turn.
  G.gutter.visible=!S.single&&G.pageL.visible&&G.pageR.visible;
  if(G.slabL){ G.slabL.visible=!S.single&&G.pageL.visible; G.slabR.visible=!S.single&&G.pageR.visible; }

  // The flap must be on screen for EVERY frame in which the pages beneath it
  // were swapped — otherwise the first frame of a peel or turn (phi == 0) shows
  // the page two ahead with nothing covering it, which reads as a hard flash.
  const on=!!(a||dr||pl);
  G.flapF.visible=on; G.flapB.visible=on;
  if(on){
    G.gF.setIndex(sgn>0?G.gF.userData.iA:G.gF.userData.iB);
    G.gB.setIndex(sgn>0?G.gB.userData.iA:G.gB.userData.iB);
    setUV(G.gF, sgn<0); setUV(G.gB, sgn>0);
    const tf=front?texOf(front):null, tb=back?texOf(back):null;
    G.flapF.material.map=tf||null; G.flapF.material.color.setHex(tf?0xffffff:0xfbf8f4);
    G.flapB.material.map=tb||null; G.flapB.material.color.setHex(tb?0xffffff:0xfbf8f4);
    G.flapF.material.needsUpdate=true; G.flapB.material.needsUpdate=true;
    G.flapF.position.z=G.flapB.position.z=G.flapZ;
    deform(sgn,PHI,a||dr||pl);
  }
  G.r.render(G.scene,G.cam);
}

let frameSum=0,frameN=0,lastT=0,quality=2;
function budget(){
  const now=performance.now();
  if(lastT){ const dt=now-lastT; if(dt<400){ frameSum+=dt; frameN++; } }
  lastT=now;
  if(frameN>=24){
    const avg=frameSum/frameN; frameSum=0; frameN=0;
    if(avg>30&&quality>1){ quality=1; if(G.r) G.r.shadowMap.enabled=false; }
    else if(avg>52&&quality>0){ quality=0; if(G.r) G.r.setPixelRatio(1); }
  }
}
let pending=false;
function mark(){ if(pending) return; pending=true; requestAnimationFrame(()=>{ pending=false; scene(); }); }

/* ══ flat fallback (no WebGL) ══ */
function flatDraw(){
  const L=S.single?null:(S.s===0?null:2*S.s), R=S.single?S.page:(S.s>=S.nSheets?null:2*S.s+1);
  const el=$("flat"); el.classList.add("on"); CVS.style.display="none";
  const st=$("stage").getBoundingClientRect();
  const h=Math.min(st.height-30,(st.width-120)/((S.single?1:2)/S.ratio));
  [["flatL",L],["flatR",R]].forEach(([id,p])=>{
    const im=$(id); const e=p?want(p):null;
    im.style.display=p?"block":"none"; im.style.height=h+"px";
    if(e&&im.src!==e.url) im.src=e.url;
  });
}

/* ══ animation ══ */
const ease=t=>1-Math.pow(1-t,2.2);           // flick out, settle in
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function turnMeta(dir){
  const {W,H}=dims();
  if(S.single){
    const p0=S.page,p1=p0+dir;
    return {single:true,p0,p1,sgn:dir>0?1:-1,
      front:dir>0?p0:p1, back:dir>0?p1:p0,
      underL:null, underR:dir>0?p1:p0,
      s0:S.s,s1:S.s, cy:-H/2*0.98};
  }
  const s0=S.s,s1=s0+dir, sh=dir>0?s0:s1;
  return {s0,s1,sgn:dir>0?1:-1,
    front:sh*2+1, back:sh*2+2,
    underL: dir>0?2*s0:2*s1,
    underR: dir>0?2*s1+1:2*s0+1,
    cy:-H/2*0.98};
}
function startTurn(dir,fromT){
  const m=turnMeta(dir);
  if(m.sgn<0){ const t=m.front; m.front=m.back; m.back=t; }
  S.peel=null;
  const t0=fromT||0;
  S.anim=Object.assign(m,{dir,t0:performance.now(),t:t0,pe:0,phi:Math.PI*t0,startT:t0});
  swish(); requestAnimationFrame(step);
}
function step(now){
  const a=S.anim; if(!a) return;
  const span=DUR*(1-a.startT);
  const raw=Math.min(1,(now-a.t0)/Math.max(120,span));
  a.t=a.startT+(1-a.startT)*ease(raw);
  a.pe=ease(Math.min(1,raw*1.9));
  a.phi=Math.PI*a.t;
  budget(); scene();
  if(raw<1) requestAnimationFrame(step);
  else{
    if(a.single) S.page=a.p1; else S.s=a.s1;
    S.anim=null; chrome(); scene(); prefetch();
    if(S.q){ const d=S.q>0?1:-1; S.q-=d; d>0?next():prev(); }
  }
}
function next(){
  if(S.anim||S.drag){ S.q=Math.max(-2,Math.min(2,S.q+1)); return; }
  if(S.single){ if(S.page>=S.n) return; } else if(S.s>=S.nSheets) return;
  startTurn(1); chrome();
}
function prev(){
  if(S.anim||S.drag){ S.q=Math.max(-2,Math.min(2,S.q-1)); return; }
  if(S.single){ if(S.page<=1) return; } else if(S.s<=0) return;
  startTurn(-1); chrome();
}
function goPage(p){
  p=Math.max(1,Math.min(S.n,p|0));
  S.want=p; S.anim=null; S.drag=null; S.peel=null; S.q=0;
  if(S.single) S.page=p; else S.s=(p<=1)?0:Math.floor(p/2);
  chrome(); scene(); prefetch();
}

/* ══ chrome ══ */
function first(){
  if(S.single) return (S.anim&&S.anim.single)?S.anim.p1:S.page;
  if(S.anim) return S.anim.s1===0?1:S.anim.s1*2;
  return S.s===0?1:S.s*2;
}
function chrome(){
  const a=first();
  const b=(!S.single&&(S.anim?S.anim.s1:S.s)>0)?Math.min(a+1,S.n):a;
  $("count").textContent=(a===b?a:a+"–"+b)+" / "+S.n;
  const s=S.anim?S.anim.s1:S.s;
  const pg=(S.anim&&S.anim.single)?S.anim.p1:S.page;
  $("btnPrev").disabled=S.single?pg<=1:s<=0;
  $("btnNext").disabled=S.single?pg>=S.n:s>=S.nSheets;
  document.querySelectorAll(".thumb").forEach(t=>{
    const p=+t.dataset.p; t.classList.toggle("here",p>=a&&p<=b);
  });
  if(!(S.want>=a&&S.want<=b)) S.want=a;
  try{ history.replaceState(null,"","#p="+S.want); }catch(e){}
}
function layout(){
  const wasSingle=S.single;
  const narrow=window.innerWidth<760;
  const portrait=window.innerHeight>window.innerWidth;
  // A phone held upright cannot show an A4 spread at a readable size, so turn the
  // book sideways instead of falling back to a single page. Rotate the phone to
  // landscape and it straightens out on its own.
  S.roll=(!S.forceSingle&&narrow&&portrait&&CONFIG.portraitRotate)?CONFIG.portraitRotate:0;
  // landscape always has room for a spread, however narrow the phone is
  S.single=S.forceSingle||(narrow&&portrait&&!S.roll);
  $("stage").classList.toggle("rolled",!!S.roll);
  if(wasSingle!==S.single&&S.n){
    if(S.single) S.page=first(); else S.s=(S.page<=1)?0:Math.floor(S.page/2);
  }
  if(S.flat){ if(S.n){ chrome(); flatDraw(); } return; }
  fitCamera();
  if(S.n){ chrome(); scene(); prefetch(); }
}

/* ══ pointer: hover peel, corner drag, swipe, click ══ */
const RAY=()=>new T3.Raycaster();
let planeZ=null, ndc=null, hit=null;
function toBook(cx,cy){
  const r=CVS.getBoundingClientRect();
  if(!ndc){ ndc=new T3.Vector2(); planeZ=new T3.Plane(new T3.Vector3(0,0,1),0); hit=new T3.Vector3(); }
  ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  const ray=RAY(); ray.setFromCamera(ndc,G.cam);
  if(!ray.ray.intersectPlane(planeZ,hit)) return null;
  return {x:hit.x-G.book.position.x, y:hit.y};
}
/* which page corner is the pointer near? returns meta or null */
function cornerAt(cx,cy){
  const b=toBook(cx,cy); if(!b) return null;
  const {W,H}=dims();
  // whichever half of the page edge you are nearer — no dead band to blink through
  const cy0=(b.y<0?-1:1)*H/2*0.98;
  if(Math.abs(b.y)>H*0.56) return null;
  // it takes less to keep a peel alive than to start one, so the boundary can't flutter
  const held=S.peel?S.peel.sgn:0;
  const inner=g=>(held===g?0.44:0.62);
  if(S.single){
    const hw=W/2;
    if(b.x>hw*inner(1)&&b.x<hw*1.18&&S.page<S.n) return mkPeel(1,cy0);
    if(b.x<-hw*inner(-1)&&b.x>-hw*1.18&&S.page>1) return mkPeel(-1,cy0);
    return null;
  }
  if(b.x>W*inner(1)&&b.x<W*1.14&&S.s<S.nSheets) return mkPeel(1,cy0);
  if(b.x<-W*inner(-1)&&b.x>-W*1.14&&S.s>0) return mkPeel(-1,cy0);
  return null;
}
function mkPeel(sgn,cy){
  const {W,H}=dims();
  const m=turnMeta(sgn>0?1:-1);
  if(m.sgn<0){ const t=m.front; m.front=m.back; m.back=t; }
  m.cy=cy;
  m.under = sgn>0 ? m.underR : m.underL;
  return m;
}
let peelRAF=0, peelNext=null;
const PEEL_IN=190, PEEL_OUT=150, PEEL_SLIDE=200;
/* time-based, not per-frame: a slow device must not get a slow-motion peel */
function peelTick(now){
  peelRAF=0;
  const pl=S.peel; if(!pl||S.drag||S.anim) return;
  const span=pl.goal>pl.from?PEEL_IN:PEEL_OUT;
  const k=Math.min(1,(now-pl.t0)/span);
  pl.k=Math.max(0,Math.min(1,pl.from+(pl.goal-pl.from)*easeIO(k)));
  // the grabbed corner slides between top and bottom rather than jumping
  const ck=Math.min(1,(now-pl.cyT0)/PEEL_SLIDE);
  pl.cy=pl.cyFrom+(pl.cyTo-pl.cyFrom)*easeIO(ck);
  if(k<1||ck<1) peelRAF=requestAnimationFrame(peelTick);
  else if(pl.goal<=0){
    S.peel=null; CVS.classList.remove("grab");
    if(peelNext){ const m=peelNext; peelNext=null; setPeel(m); }
    scene(); return;
  }
  S.peel.phi=PEELPHI*pl.k*PEELMAX;
  scene();
}
function aimPeel(goal){
  const pl=S.peel; if(!pl||pl.goal===goal) return;
  pl.from=pl.k; pl.goal=goal; pl.t0=performance.now();
  if(!peelRAF) peelRAF=requestAnimationFrame(peelTick);
}
function slidePeel(cy){
  const pl=S.peel; if(!pl||pl.cyTo===cy) return;
  pl.cyFrom=pl.cy; pl.cyTo=cy; pl.cyT0=performance.now();
  if(!peelRAF) peelRAF=requestAnimationFrame(peelTick);
}
function setPeel(m){
  const {W,H}=dims();
  if(!m){ peelNext=null; aimPeel(0); return; }
  if(S.peel&&S.peel.sgn===m.sgn){
    aimPeel(1); slidePeel(m.cy); return;
  }
  if(S.peel){ peelNext=m; aimPeel(0); return; }   // other side: fade out first, then in
  peelNext=null;
  const now=performance.now();
  S.peel=Object.assign(m,{k:0,from:0,goal:1,t0:now,phi:0,boost:PEELCURL,
    flatFar:true,span:PEELSPAN,cyFrom:m.cy,cyTo:m.cy,cyT0:now});
  CVS.classList.add("grab");
  if(!peelRAF) peelRAF=requestAnimationFrame(peelTick);
}
let sx=0,sy=0,tracking=false,swipedAt=0,moved=false;
const fromSwipe=()=>Date.now()-swipedAt<400;

CVS.addEventListener("pointermove",e=>{
  if(S.drag){
    const b=toBook(e.clientX,e.clientY); if(!b) return;
    const {W,H}=dims();
    let Tx=S.drag.sgn*b.x;
    Tx=Math.max(-W*1.02,Math.min(W,Tx));
    S.drag.phi=phiFromX(Tx); S.drag.t=S.drag.phi/Math.PI;
    S.drag.boost=1+(PEELCURL-1)*Math.max(0,1-S.drag.t*4);
    S.drag.span=PEELSPAN+(1-PEELSPAN)*Math.min(1,S.drag.t*3);
    moved=true; mark(); return;
  }
  if(S.anim) return;
  setPeel(cornerAt(e.clientX,e.clientY));
});
CVS.addEventListener("pointerleave",()=>{ if(!S.drag) setPeel(null); });

CVS.addEventListener("pointerdown",e=>{
  sx=e.clientX; sy=e.clientY; tracking=true; moved=false;
  if(S.anim) return;
  const m=cornerAt(e.clientX,e.clientY);
  if(!m) return;
  const {W,H}=dims();
  const k=(S.peel&&S.peel.sgn===m.sgn)?S.peel.k:0;
  S.peel=null;
  const p0=PEELPHI*k*PEELMAX;
  S.drag=Object.assign(m,{dir:m.sgn>0?1:-1,t:p0/Math.PI,phi:p0,boost:PEELCURL,
    flatFar:true,span:PEELSPAN});
  CVS.classList.remove("grab"); CVS.classList.add("grabbing");
  try{ CVS.setPointerCapture(e.pointerId); }catch(x){}
  mark();
});
function endDrag(){
  const d=S.drag; if(!d) return;
  CVS.classList.remove("grabbing");
  const dir=d.dir, t=d.t;
  S.drag=null;
  // pressed a corner and let go without dragging: that is a click, so turn the page
  if(!moved||t<0.035){ dir>0?next():prev(); return; }
  if(t>0.40){ startTurn(dir,t); }
  else{
    const t0=performance.now(), from=t;
    S.drag=Object.assign(d,{releasing:true});
    const back=now=>{
      const k=Math.min(1,(now-t0)/240);
      if(!S.drag){ return; }
      const kk=1-easeIO(k);
      S.drag.t=from*kk; S.drag.phi=Math.PI*S.drag.t;
      S.drag.boost=1+(PEELCURL-1)*Math.max(0,1-S.drag.t*4);
      scene();
      if(k<1) requestAnimationFrame(back);
      else{ S.drag=null; scene(); }
    };
    requestAnimationFrame(back);
  }
}
CVS.addEventListener("pointerup",e=>{
  if(S.drag&&!S.drag.releasing){ endDrag(); tracking=false; return; }
  if(!tracking) return; tracking=false;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  // when the book is turned sideways the page travels up/down the screen
  const along=S.roll? dy*S.roll : dx, across=S.roll? dx : dy;
  if(Math.abs(along)>52&&Math.abs(along)>Math.abs(across)*1.6){
    swipedAt=Date.now(); along<0?next():prev(); return;
  }
  if(Math.abs(dx)>8||Math.abs(dy)>8) return;
  const b=toBook(e.clientX,e.clientY); if(!b) return;
  const {W,H}=dims();
  if(Math.abs(b.y)>H/2) return;
  if(S.single){ if(Math.abs(b.x)>W/2) return; b.x<0?prev():next(); return; }
  if(Math.abs(b.x)>W) return;
  b.x<0?prev():next();
});
CVS.addEventListener("pointercancel",()=>{ tracking=false; if(S.drag&&!S.drag.releasing) endDrag(); });

/* ══ thumbnails ══ */
let thumbsBuilt=false;
async function thumbs(){
  const wrap=$("thumbs"); wrap.innerHTML="";
  for(let p=1;p<=S.n;p++){
    const b=document.createElement("button");
    b.className="thumb"; b.dataset.p=p;
    b.style.setProperty("--ar",(1/S.ratio).toFixed(3));
    b.innerHTML='<div class="ph"></div><span>'+p+'</span>';
    b.addEventListener("click",()=>{ goPage(p); closePanel("panelThumbs"); });
    wrap.appendChild(b);
  }
  chrome();
  for(let p=1;p<=S.n;p++){
    try{
      const e=await renderPage(p,THUMB_W);
      const b=wrap.querySelector('.thumb[data-p="'+p+'"]');
      if(b&&b.firstChild){ const i=new Image(); i.src=e.url; i.alt="Page "+p; i.decoding="async"; b.replaceChild(i,b.firstChild); }
    }catch(x){}
    await new Promise(r=>setTimeout(r,0));
  }
  chrome();
}
function ensureThumbs(){ if(thumbsBuilt||!S.n) return; thumbsBuilt=true; thumbs(); }

/* ══ contents ══ */
async function contents(){
  let out=[]; try{ out=await S.doc.getOutline(); }catch(e){}
  if(!out||!out.length) return;
  const ul=$("toc");
  const add=async(items,lvl)=>{
    for(const it of items){
      const li=document.createElement("li"), btn=document.createElement("button");
      if(lvl>1) btn.className="lvl2";
      const t=document.createElement("span"); t.textContent=it.title||"Untitled";
      btn.appendChild(t); li.appendChild(btn); ul.appendChild(li);
      try{
        const dest=typeof it.dest==="string"?await S.doc.getDestination(it.dest):it.dest;
        const pg=(await S.doc.getPageIndex(dest[0]))+1;
        const sp=document.createElement("span"); sp.className="pg"; sp.textContent=pg;
        btn.appendChild(sp);
        btn.addEventListener("click",()=>{ goPage(pg); closePanel("panelToc"); });
      }catch(e){ btn.disabled=true; }
      if(it.items&&it.items.length) await add(it.items,lvl+1);
    }
  };
  await add(out,1);
  $("btnToc").hidden=false;
}

/* ══ zoom ══ */
const zoomOpen=()=>$("zoom").classList.contains("open");
function zoomFit(){
  const img=$("zoomImg");
  if(!img.getAttribute("src")) return;
  img.style.width=Math.round(Math.min(3200,Math.max(280,window.innerWidth-40)*S.zscale))+"px";
}
function zoomChrome(){
  $("zPrev").disabled=S.zp<=1; $("zNext").disabled=S.zp>=S.n;
  $("zOut").disabled=S.zscale<=.55; $("zIn").disabled=S.zscale>=3.2;
}
function zoomTo(p){
  if(!S.n) return;
  S.zp=Math.max(1,Math.min(S.n,p));
  const img=$("zoomImg");
  $("zoom").classList.add("open"); img.removeAttribute("src"); zoomChrome();
  const w=Math.min(2400,Math.max(1200,Math.round(window.innerWidth*S.DPR*1.6)));
  renderPage(S.zp,w).then(e=>{ if(zoomOpen()){ img.src=e.url; img.alt="Page "+S.zp; zoomFit(); } }).catch(()=>{});
}
function zoomClose(){ $("zoom").classList.remove("open"); $("zoomImg").removeAttribute("src"); }
$("btnZoomIn").addEventListener("click",()=>zoomTo(S.single?S.page:first()));
$("btnZoomOut").addEventListener("click",()=>{ if(zoomOpen()){ S.zscale=Math.max(.55,S.zscale/1.3); zoomFit(); zoomChrome(); } else zoomTo(S.single?S.page:first()); });
$("zPrev").addEventListener("click",()=>zoomTo(S.zp-1));
$("zNext").addEventListener("click",()=>zoomTo(S.zp+1));
$("zIn").addEventListener("click",()=>{ S.zscale=Math.min(3.2,S.zscale*1.3); zoomFit(); zoomChrome(); });
$("zOut").addEventListener("click",()=>{ S.zscale=Math.max(.55,S.zscale/1.3); zoomFit(); zoomChrome(); });
$("zClose").addEventListener("click",zoomClose);
$("zoom").addEventListener("click",e=>{ if(e.target.id==="zoom") zoomClose(); });

/* ══ panels + menu ══ */
const anyPanelOpen=()=>!!document.querySelector(".panel.open");
let panelOpener=null;
function openPanel(id){
  panelOpener=document.activeElement;
  document.querySelectorAll(".panel").forEach(p=>{
    const on=p.id===id;
    p.classList.toggle("open",on); p.setAttribute("aria-hidden",String(!on)); p.inert=!on;
  });
  if(id==="panelThumbs") ensureThumbs();
  const f=$(id).querySelector("button"); if(f) f.focus();
}
function closePanel(id){
  const p=$(id);
  if(!p.classList.contains("open")) return;
  p.classList.remove("open"); p.setAttribute("aria-hidden","true"); p.inert=true;
  if(panelOpener&&document.contains(panelOpener)) panelOpener.focus();
  panelOpener=null;
}
document.querySelectorAll(".panel").forEach(p=>{ p.inert=true; });
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closePanel(b.dataset.close)));
const toggle=id=>$(id).classList.contains("open")?closePanel(id):openPanel(id);
$("btnThumbs").addEventListener("click",()=>toggle("panelThumbs"));
$("btnToc").addEventListener("click",()=>toggle("panelToc"));
function menuOpen(v){ $("menu").classList.toggle("open",v); $("btnMore").setAttribute("aria-expanded",String(v)); }
$("btnMore").addEventListener("click",e=>{ e.stopPropagation(); menuOpen(!$("menu").classList.contains("open")); });
document.addEventListener("click",()=>menuOpen(false));
$("menu").addEventListener("click",e=>e.stopPropagation());

let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* ══ controls ══ */
$("btnPrev").addEventListener("click",()=>{ if(!fromSwipe()) prev(); });
$("btnNext").addEventListener("click",()=>{ if(!fromSwipe()) next(); });
$("btnFull").addEventListener("click",()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
});
$("btnShare").addEventListener("click",async()=>{
  const url=location.href;
  try{
    if(navigator.share){ await navigator.share({title:document.title,url}); return; }
    await navigator.clipboard.writeText(url); toast("Link copied");
  }catch(e){ toast(url); }
});
$("mDownload").addEventListener("click",()=>{
  menuOpen(false); if(!S.src) return;
  const a=document.createElement("a");
  a.href=S.src; a.download=(CONFIG.pdf||"document.pdf").split("/").pop();
  document.body.appendChild(a); a.click(); a.remove();
});
$("mSingle").addEventListener("click",()=>{
  menuOpen(false); S.forceSingle=!S.forceSingle;
  $("mSingleLabel").textContent=S.forceSingle?"Two pages":"Single page";
  layout();
});
$("mStart").addEventListener("click",()=>{ menuOpen(false); goPage(1); });
$("mEnd").addEventListener("click",()=>{ menuOpen(false); goPage(S.n); });
$("mSound").addEventListener("click",()=>{
  menuOpen(false); S.sound=!S.sound;
  $("mSoundLabel").textContent=S.sound?"Sound on":"Sound off";
  if(S.sound) swish();
});
$("mSoundLabel").textContent=S.sound?"Sound on":"Sound off";

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(zoomOpen()){
    if(e.key==="ArrowRight"){ e.preventDefault(); zoomTo(S.zp+1); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); zoomTo(S.zp-1); }
    else if(e.key==="+"||e.key==="="){ e.preventDefault(); $("zIn").click(); }
    else if(e.key==="-"){ e.preventDefault(); $("zOut").click(); }
    else if(e.key==="Escape") zoomClose();
    return;
  }
  if(anyPanelOpen()){ if(e.key==="Escape"){ closePanel("panelThumbs"); closePanel("panelToc"); } return; }
  if($("menu").classList.contains("open")){ if(e.key==="Escape") menuOpen(false); return; }
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Home"){ e.preventDefault(); goPage(1); }
  else if(e.key==="End"){ e.preventDefault(); goPage(S.n); }
});

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ layout(); if(zoomOpen()) zoomFit(); },140); });
window.addEventListener("hashchange",()=>{
  const p=parseInt((location.hash.match(/p=(\d+)/)||[])[1]||"",10);
  if(p&&p!==S.want) goPage(p);
});

/* ══ loading ══ */
function intro(html){ $("introCard").innerHTML=html; $("intro").classList.remove("gone"); }
function progress(f){
  const bar=$("progBar"), pct=$("progPct");
  if(!bar||!pct) return;
  if(f==null){ pct.textContent="Loading…"; return; }
  const v=Math.max(0,Math.min(1,f));
  bar.style.width=(v*100).toFixed(0)+"%"; pct.textContent=(v*100).toFixed(0)+"%";
}
function readFile(f){
  intro('<div class="spin"></div><p>Opening '+f.name.replace(/[<>&]/g,"")+'…</p>');
  const r=new FileReader();
  r.onerror=()=>chooser("Couldn’t read that file.");
  r.onload=()=>load({data:new Uint8Array(r.result)},f.name);
  r.readAsArrayBuffer(f);
}
function chooser(msg){
  intro('<h1>Open your flipbook</h1>'+
    (msg?'<p class="err"></p>':'<p>Pick a PDF from this device, or drag one onto the window. Nothing is uploaded — it stays in your browser.</p>')+
    '<button class="pick" id="pickBtn">Choose a PDF</button>'+
    '<input type="file" id="pickInput" accept="application/pdf" hidden>'+
    '<p class="hint">← → to turn · kone ko pakad kar kheenchein</p>');
  if(msg) $("introCard").querySelector(".err").textContent=msg;
  $("pickBtn").addEventListener("click",()=>$("pickInput").click());
  $("pickInput").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) readFile(f); });
}

let LIB=null;
async function load(src,name){
  try{
    const opts=(typeof src==="string")?{url:src}:Object.assign({},src);
    opts.isEvalSupported=false;
    const task=LIB.getDocument(opts);
    task.onProgress=p=>progress(p&&p.total?p.loaded/p.total:null);
    S.doc=await task.promise;
    S.n=S.doc.numPages; S.nSheets=Math.ceil(S.n/2);
    const p1=await S.doc.getPage(1), v=p1.getViewport({scale:1});
    S.ratio=v.height/v.width;

    let title=CONFIG.title;
    if(!title){ try{ const m=await S.doc.getMetadata(); title=(m.info&&m.info.Title)||""; }catch(e){} }
    $("brand").textContent=title||name||"Flipbook";
    document.title=title||name||"Flipbook";
    if(CONFIG.showDownload&&typeof src==="string"){ S.src=src; $("mDownload").hidden=false; }

    const hash=parseInt((location.hash.match(/p=(\d+)/)||[])[1]||CONFIG.startPage,10)||1;
    S.page=Math.min(Math.max(1,hash),S.n); S.want=S.page;
    S.s=(S.page<=1)?0:Math.floor(S.page/2);

    layout();
    await Promise.all([1,2,3].filter(p=>p<=S.n).map(p=>renderPage(p,S.MW).catch(()=>{})));
    scene(); chrome();
    $("intro").classList.add("gone");
    contents();
  }catch(err){
    console.error(err);
    chooser(location.protocol==="file:"
      ? "Browsers block file loading over file:// — run a local server (python3 -m http.server) or choose the PDF below."
      : "Couldn’t open that PDF. Check the path in CONFIG, or pick a file below.");
  }
}

["dragenter","dragover"].forEach(t=>window.addEventListener(t,e=>{ e.preventDefault(); document.body.classList.add("dragging"); }));
window.addEventListener("dragleave",e=>{ if(e.clientX<=0||e.clientY<=0) document.body.classList.remove("dragging"); });
window.addEventListener("drop",e=>{
  e.preventDefault(); document.body.classList.remove("dragging");
  const f=e.dataTransfer&&e.dataTransfer.files[0];
  if(f&&/pdf/i.test(f.type||f.name)) readFile(f);
});

function resolvePdf(t){
  if(!t) return null;
  try{ const u=new URL(t,document.baseURI);
    return /^(https?|file|blob|data):$/.test(u.protocol)?u.href:null;
  }catch(e){ return null; }
}
function sameOrigin(t){ try{ return new URL(t,document.baseURI).origin===location.origin; }catch(e){ return false; } }

window.__fbdbg={get S(){return S},get G(){return G},get T3(){return T3},scene,dims};
let booted=false;
window.__flipbook=function(lib,three){
  if(booted) return;
  booted=true; clearTimeout(watchdog);
  LIB=lib; T3=three;
  if(T3){ if(!initGL()){ S.flat=true; } } else { S.flat=true; }
  if(S.flat){ CVS.style.display="none"; $("flat").classList.add("on"); }
  layout();
  if(!LIB){ chooser("PDF engine didn’t load. Check your connection and reload."); return; }
  let q=null; try{ q=new URLSearchParams(location.search).get("pdf"); }catch(e){}
  if(q&&!sameOrigin(q)) q=null;
  const target=resolvePdf(q||CONFIG.pdf);
  target?load(target):chooser();
};
const watchdog=setTimeout(()=>{ if(!booted) window.__flipbook(null,null); },22000);
})();
</script>

<!-- Engines: pdf.js 4 renders the pages, three.js bends them. -->
<script type="module">
const PDFV="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/";
const THREEV="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js";
const PDF3="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadUmd(){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=PDF3+"pdf.min.js";
    s.onload=()=>{ const l=window.pdfjsLib;
      if(!l) return rej(new Error("pdfjsLib missing"));
      l.GlobalWorkerOptions.workerSrc=PDF3+"pdf.worker.min.js"; res(l); };
    s.onerror=()=>rej(new Error("cdn unreachable"));
    document.head.appendChild(s);
  });
}
(async function(){
  let lib=null,three=null;
  try{
    lib=await import(PDFV+"pdf.min.mjs");
    lib.GlobalWorkerOptions.workerSrc=PDFV+"pdf.worker.min.mjs";
  }catch(e){
    console.warn("pdf.js 4 unavailable, falling back:",e);
    try{ lib=await loadUmd(); }catch(e2){ console.error(e2); lib=null; }
  }
  try{ three=await import(THREEV); }
  catch(e){ console.warn("three.js unavailable — flat mode:",e); three=null; }
  window.pdfjsLib=lib;
  window.__flipbook(lib,three);
})();
</script>
